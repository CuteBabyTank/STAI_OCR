version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
       - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull the required models on first start.
    entrypoint: >
      sh -c "ollama serve & sleep 3 &&
             ollama pull minicpm-v &&
             ollama pull llama3.2:3b &&
             wait"

  web:
    build: .
    command: streamlit run receipt_processor.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8502:8501"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MLFLOW_TRACKING_URI=file:/app/mlruns
    volumes:
      - .:/app

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MLFLOW_TRACKING_URI=file:/app/mlruns
    volumes:
      - .:/app

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:/app/mlruns
    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
    ports:
      - "5000:5000"
    volumes:
      - app_data:/app

volumes:
  ollama_data:
  app_data:
