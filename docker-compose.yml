services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pulls are best-effort: a failed download (e.g. no internet in the container)
    # must NOT kill the server, or dependent containers lose the `ollama` hostname.
    # `ollama serve` stays in the foreground via `wait`; each pull is isolated with
    # `|| true` so the container keeps serving whatever models are already cached.
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5;
      (ollama list | grep -q qwen3-vl || ollama pull qwen3-vl:8b) || true;
      (ollama list | grep -q llama3.2:3b || ollama pull llama3.2:3b) || true;
      (ollama list | grep -q nomic-embed-text || ollama pull nomic-embed-text) || true;
      wait
      "

  web:
    build: .
    # fileWatcherType=poll: Windows bind mounts don't deliver inotify events, so
    # the default watcher never sees edits. Polling picks them up; runOnSave then
    # auto-reruns. Without this, code changes require a container restart.
    command: streamlit run receipt_processor.py --server.port=8501 --server.address=0.0.0.0 --server.enableXsrfProtection=false --server.fileWatcherType=poll --server.runOnSave=true
    ports:
      - "8502:8501"
    depends_on:
      ollama:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - .:/app

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    depends_on:
      ollama:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - .:/app

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    command: >
      mlflow ui
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlruns
    ports:
      - "5000:5000"
    volumes:
      - .:/app

volumes:
  ollama_data:
