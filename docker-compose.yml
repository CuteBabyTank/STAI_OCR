services:
  # Aperture — the Next.js frontend (the app's only UI). It calls the FastAPI
  # `api` service for OCR extraction, the ledger, and the RAG agent. The browser
  # hits same-origin /api/* which Next rewrites to http://api:8000 (see
  # web-next/next.config.js), so there's no CORS to configure.
  web:
    build: ./web-next
    ports:
      - "8502:3000"
    depends_on:
      - api
    environment:
      - API_BASE=http://api:8000

  api:
    build: .
    # SQLite's file locking does not work on Docker Desktop's Windows/Mac bind
    # mount (the virtual FS can't provide POSIX locks / WAL shared memory), which
    # makes every DB write fail with "unable to open database file". So the ledger
    # lives on a named volume (real Linux fs) instead of the bind-mounted repo.
    # On first start we seed that volume from the repo's ledger.db if present, so
    # existing data carries over; thereafter the volume is the source of truth.
    command: >
      sh -c "mkdir -p /data &&
             { [ -f /data/ledger.db ] || cp /app/ledger.db /data/ledger.db 2>/dev/null || true; } &&
             exec uvicorn api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    depends_on:
      mlflow:
        condition: service_started
    # LLM runs on the shared class Ollama endpoint (Week 5 lab server) instead of
    # a local model, so no GPU/large-RAM is needed here. Override any of these via
    # the environment / an .env file. Set OLLAMA_HOST back to a local Ollama and
    # VISION_MODEL/AGENT_MODEL to local models to run fully offline.
    environment:
      # Keep the ledger off the bind mount (see command above) so SQLite locking works.
      - LEDGER_DB_PATH=/data/ledger.db
      - OLLAMA_HOST=${OLLAMA_HOST:-http://103.231.240.155:11434}
      - VISION_MODEL=${VISION_MODEL:-gemma4:e4b}
      - AGENT_MODEL=${AGENT_MODEL:-gemma4:12b}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      # NOTE: VISION_MAX_DIM/VISION_NUM_CTX used to be set here but were never read by
      # the app. VISION_MAX_DIM=0 read as "no downscaling" while OCR_MAX_IMAGE_DIM=1600
      # below was doing the resizing all along. Use the OCR_* knobs; they are the live ones.
      - OCR_NUM_CTX=${OCR_NUM_CTX:-8192}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
      # Parallel vision calls per batch. Match this to how many concurrent requests
      # the OLLAMA_HOST endpoint will serve (its OLLAMA_NUM_PARALLEL).
      - OCR_CONCURRENCY=3
      # Downscale long edge before inference (speed + accepts big phone photos).
      - OCR_MAX_IMAGE_DIM=1600
      # For high-volume bulk imports, sample traces instead of one run per page:
      #   - MLFLOW_SAMPLE_RATE=0.05   # keep 5% of extraction traces
      #   - MLFLOW_ENABLED=0          # or turn tracing off entirely
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - .:/app
      - ledger_data:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    command: >
      mlflow ui
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlruns
    # Host port 5001 (not 5000): macOS Control Center / AirPlay Receiver binds
    # 5000 by default, which collides with the container's published port.
    ports:
      - "5001:5000"
    volumes:
      - .:/app

volumes:
  # Named volume for the SQLite ledger — a real Linux filesystem where SQLite
  # locking/WAL work, unlike the Windows/Mac bind mount. Persists across restarts.
  ledger_data:
