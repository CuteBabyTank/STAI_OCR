services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      (ollama list | grep -q minicpm-v || ollama pull minicpm-v) &&
      (ollama list | grep -q llama3.2:3b || ollama pull llama3.2:3b) &&
      wait
      "

  web:
    build: .
    command: streamlit run receipt_processor.py --server.port=8501 --server.address=0.0.0.0 --server.enableXsrfProtection=false
    ports:
      - "8502:8501"
    depends_on:
      ollama:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - .:/app

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    depends_on:
      ollama:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - .:/app

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow ui
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlruns
    ports:
      - "5000:5000"
    volumes:
      - .:/app

volumes:
  ollama_data:
