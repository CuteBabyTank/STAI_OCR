services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pulls are best-effort: a failed download (e.g. no internet in the container)
    # must NOT kill the server, or dependent containers lose the `ollama` hostname.
    # `ollama serve` stays in the foreground via `wait`; each pull is isolated with
    # `|| true` so the container keeps serving whatever models are already cached.
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5;
      (ollama list | grep -q qwen2.5vl || ollama pull qwen2.5vl:7b) || true;
      (ollama list | grep -q llama3.2:3b || ollama pull llama3.2:3b) || true;
      (ollama list | grep -q nomic-embed-text || ollama pull nomic-embed-text) || true;
      wait
      "

  # Aperture — the Next.js frontend (the app's only UI). It calls the
  # FastAPI `api` service for OCR extraction, the ledger, and the RAG agent. The
  # browser hits same-origin /api/* which Next rewrites to http://api:8000 (see
  # web-next/next.config.js), so there's no CORS to configure.
  web:
    build: ./web-next
    ports:
      - "8502:3000"
    depends_on:
      - api
    environment:
      - API_BASE=http://api:8000

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    depends_on:
      ollama:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - .:/app

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    command: >
      mlflow ui
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlruns
    # Host port 5001 (not 5000): macOS Control Center / AirPlay Receiver binds
    # 5000 by default, which collides with the container's published port.
    ports:
      - "5001:5000"
    volumes:
      - .:/app

volumes:
  ollama_data:
