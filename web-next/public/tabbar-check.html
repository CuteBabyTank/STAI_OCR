<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tab bar check</title>
<!--
  On-device probe for the phone tab bar. Open this on the actual phone.

  It does not carry its own copy of the stylesheet — it fetches the app's home
  page, reads whichever hashed CSS file that page is currently linking, and
  loads THAT. So it measures the stylesheet the server is really serving, which
  is the only way to tell a layout bug apart from a stale deploy. It then
  renders the tab bar markup verbatim and reports the measured geometry.

  Delete this file once the bar is confirmed good; it is a diagnostic, not a
  feature.
-->
<style>
  body { margin:0; font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #report { padding:16px 16px 140px; }
  h1 { font-size:17px; margin:0 0 12px; }
  .verdict { padding:12px 14px; border-radius:10px; font-weight:700; margin:0 0 14px; }
  .pass { background:#DCFCE7; color:#14532D; }
  .fail { background:#FEE2E2; color:#7F1D1D; }
  table { border-collapse:collapse; width:100%; font-size:13px; margin:0 0 14px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid #E5E7EB; }
  th { color:#6B7280; font-weight:600; }
  code { background:#F3F4F6; padding:1px 5px; border-radius:4px; font-size:12px; word-break:break-all; }
  .k { color:#6B7280; }
</style>
</head>
<body>
<div id="report">Loading the app's stylesheet…</div>

<!-- Tab bar markup, copied verbatim from the app's server-rendered output. -->
<nav class="tabbar" aria-label="Primary">
  <a class="tabbar-item on" aria-current="page" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Home</span></a>
  <a class="tabbar-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 3v6h6M3 9a9 9 0 1 1 2 9M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>History</span></a>
  <a class="tabbar-item tabbar-plus" aria-label="Scan a receipt" href="#"><span class="tabbar-bubble"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></a>
  <a class="tabbar-item" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM14 2v6h6M8 13h8M8 17h6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Receipts</span></a>
  <button type="button" class="tabbar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>More</span></button>
</nav>

<script>
(async function () {
  const el = document.getElementById("report");
  const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

  let cssHref = "(none found)";
  try {
    const html = await (await fetch("/", { cache: "no-store" })).text();
    const m = html.match(/href="([^"]*\.css[^"]*)"/);
    if (m) {
      cssHref = m[1];
      await new Promise((res, rej) => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = cssHref + (cssHref.includes("?") ? "&" : "?") + "probe=1";
        link.onload = res;
        link.onerror = rej;
        document.head.appendChild(link);
      });
    }
  } catch (e) {
    cssHref = "FETCH FAILED: " + e.message;
  }

  // Let the stylesheet settle before measuring.
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

  const bar = document.querySelector(".tabbar");
  const cs = getComputedStyle(bar);
  const items = [...bar.children];
  const boxes = items.map((c) => c.getBoundingClientRect());
  const bub = bar.querySelector(".tabbar-bubble");
  const bb = bub ? bub.getBoundingClientRect() : null;

  const ys = boxes.map((b) => Math.round(b.y));
  const oneRow = new Set(ys).size === 1;
  const widths = boxes.map((b) => b.width);
  const even = Math.max(...widths) - Math.min(...widths) < 1.5;
  const centred = bb ? Math.abs(bb.x + bb.width / 2 - innerWidth / 2) < 1.5 : false;
  const ok = oneRow && even && centred && cs.display === "flex" && cs.flexDirection === "row";

  const names = ["Home", "History", "[+ bubble]", "Receipts", "More"];
  const rows = boxes.map((b, i) =>
    "<tr><td>" + names[i] + "</td><td>" + Math.round(b.x) + "</td><td>" + Math.round(b.width) +
    "</td><td>" + Math.round(b.y) + "</td></tr>").join("");

  el.innerHTML =
    "<h1>Tab bar check</h1>" +
    '<p class="verdict ' + (ok ? "pass" : "fail") + '">' +
      (ok ? "PASS - one even row, bubble centred"
          : "FAIL - " + [
              cs.flexDirection !== "row" ? "flex-direction is " + cs.flexDirection + " (should be row)" : "",
              !oneRow ? "items on " + new Set(ys).size + " different rows" : "",
              !even ? "slot widths uneven" : "",
              !centred ? "bubble off-centre" : "",
            ].filter(Boolean).join("; ") ) +
    "</p>" +
    "<table><tr><th>slot</th><th>x</th><th>width</th><th>y</th></tr>" + rows + "</table>" +
    "<table>" +
    "<tr><th>viewport</th><td>" + innerWidth + " x " + innerHeight + " css px</td></tr>" +
    "<tr><th>devicePixelRatio</th><td>" + devicePixelRatio + "</td></tr>" +
    "<tr><th>matches (max-width:640px)</th><td>" + matchMedia("(max-width:640px)").matches + "</td></tr>" +
    "<tr><th>bar display / direction</th><td>" + cs.display + " / " + cs.flexDirection + "</td></tr>" +
    "<tr><th>bar height</th><td>" + cs.height + "</td></tr>" +
    "<tr><th>safe-area bottom</th><td>" +
      getComputedStyle(document.documentElement).getPropertyValue("--probe-sab") + "</td></tr>" +
    "<tr><th>bubble centre vs viewport</th><td>" +
      (bb ? Math.round(bb.x + bb.width / 2) + " vs " + Math.round(innerWidth / 2) : "no bubble") + "</td></tr>" +
    "<tr><th>stylesheet served</th><td><code>" + esc(cssHref) + "</code></td></tr>" +
    "</table>";
})();
</script>
<style>:root { --probe-sab: env(safe-area-inset-bottom, 0px); }</style>
</body>
</html>
